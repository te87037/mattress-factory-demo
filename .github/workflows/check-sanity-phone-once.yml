name: Check published Sanity phone once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-sanity-phone-once.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read published phone from Sanity
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const projectId = process.env.SANITY_PROJECT_ID;
          const dataset = process.env.SANITY_DATASET || 'production';
          const query = '*[_type == "siteSettings" && _id == "siteSettings"][0]{phone,_updatedAt}';
          const url = new URL(`https://${projectId}.api.sanity.io/v2026-08-03/data/query/${dataset}`);
          url.searchParams.set('query', query);

          const response = await fetch(url);
          if (!response.ok) throw new Error(`Sanity query failed: ${response.status}`);
          const payload = await response.json();
          const result = payload.result || {};

          fs.mkdirSync('docs', {recursive: true});
          fs.writeFileSync(
            'docs/SANITY_PHONE_CHECK.md',
            `# Sanity 已發布電話檢查\n\n電話：${result.phone || '(未取得)'}\n\nSanity 更新時間：${result._updatedAt || '(未取得)'}\n\n檢查執行：${new Date().toISOString()}\n`
          );
          NODE

      - name: Record result and trigger deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SANITY_PHONE_CHECK.md
          git commit -m "Record published Sanity phone [skip ci]"
          git pull --rebase origin main
          git push
