name: Submit CMS changes for review

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Create or find review pull request
        id: review
        uses: actions/github-script@v7
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = JSON.parse(process.env.PAGES_CMS_PAYLOAD);
            const branch = payload?.repository?.ref;
            if (!branch || branch === "main") {
              core.setFailed("請在預覽分支使用送出審核功能，不能直接從 main 發布。");
              return;
            }

            const { owner, repo } = context.repo;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base: "main",
              per_page: 10,
            });

            if (existing.data.length > 0) {
              const pull = existing.data[0];
              core.notice(`已存在審核 PR：${pull.html_url}`);
              core.setOutput("pull-request-url", pull.html_url);
              return;
            }

            const pull = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: "main",
              title: "更新官網產品與聯絡資訊",
              body: [
                "此 Pull Request 由 Pages CMS 的「送出審核」按鈕建立。",
                "",
                "請確認：",
                "- 產品名稱、描述與照片",
                "- 電話、地址與營業資訊",
                "- Preview 建置檢查通過",
                "",
                "合併至 main 後，正式 GitHub Pages 官網才會更新。",
              ].join("\n"),
            });

            core.notice(`已建立審核 PR：${pull.data.html_url}`);
            core.setOutput("pull-request-url", pull.data.html_url);

      - name: Add workflow summary
        run: |
          echo "## CMS 審核" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull Request：${{ steps.review.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
