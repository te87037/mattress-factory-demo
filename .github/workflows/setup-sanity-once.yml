name: Initialize Sanity CMS once

on:
  push:
    branches: [main]
    paths:
      - ".github/sanity-setup-trigger"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify configuration
        run: |
          test -n "$SANITY_WRITE_TOKEN" || { echo "Missing SANITY_WRITE_TOKEN secret"; exit 1; }
          test -n "$SANITY_AUTH_TOKEN" || { echo "Missing SANITY_AUTH_TOKEN secret"; exit 1; }
          test -n "$SANITY_PROJECT_ID" || { echo "Missing SANITY_PROJECT_ID variable"; exit 1; }
          test -n "$SANITY_DATASET" || { echo "Missing SANITY_DATASET variable"; exit 1; }
          test -n "$SANITY_STUDIO_HOST" || { echo "Missing SANITY_STUDIO_HOST variable"; exit 1; }

      - name: Import existing website content
        id: import
        run: node scripts/import-to-sanity.mjs

      - name: Install Studio dependencies
        working-directory: studio
        run: npm install

      - name: Build Studio
        working-directory: studio
        run: npm run build

      - name: Deploy Studio
        id: deploy
        working-directory: studio
        run: npx sanity deploy --yes --title "凱麗企業社內容後台" --url "$SANITY_STUDIO_HOST"

      - name: Record initialization result
        if: always()
        env:
          SETUP_STATUS: ${{ job.status }}
          IMPORT_STATUS: ${{ steps.import.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
        run: |
          mkdir -p docs
          cat > docs/SANITY_SETUP_RESULT.md <<EOF
          # Sanity 初始化結果

          狀態：${SETUP_STATUS}

          內容匯入：${IMPORT_STATUS}

          Studio 部署：${DEPLOY_STATUS}

          Project ID：${SANITY_PROJECT_ID}

          Dataset：${SANITY_DATASET}

          後台：https://${SANITY_STUDIO_HOST}.sanity.studio

          Workflow run：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SANITY_SETUP_RESULT.md
          git diff --cached --quiet || git commit -m "Record Sanity initialization result"
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Sanity 初始化：${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "內容匯入：${{ steps.import.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Studio 部署：${{ steps.deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "後台：https://${SANITY_STUDIO_HOST}.sanity.studio" >> "$GITHUB_STEP_SUMMARY"
