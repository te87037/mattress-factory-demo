name: Validate CMS preview

on:
  push:
    branches:
      - cms-preview
      - "content/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cms-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate editable content
        run: npm run apply-content

      - name: Type check
        run: npm run typecheck

      - name: Build preview
        run: npm run build

      - name: Verify static export
        run: test -f out/index.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-preview-${{ github.sha }}
          path: out
          retention-days: 7
