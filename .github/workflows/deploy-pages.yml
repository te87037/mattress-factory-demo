name: Deploy website and Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-content-update]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployed_phone: ${{ steps.content-status.outputs.phone }}
    env:
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
      SANITY_STUDIO_BASEPATH: /mattress-factory-demo/studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install website dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Record synchronized phone
        id: content-status
        run: |
          PHONE=$(node -p "require('./content/site.json').phone")
          echo "phone=${PHONE}" >> "$GITHUB_OUTPUT"

      - name: Install Studio dependencies
        working-directory: studio
        run: npm install

      - name: Build Studio
        working-directory: studio
        run: npm run build

      - name: Add Studio to website export
        run: |
          rm -rf out/studio
          mkdir -p out/studio
          cp -R studio/dist/. out/studio/

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/studio/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-status:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: write
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      DEPLOY_STATUS: ${{ needs.deploy.result }}
      DEPLOYED_PHONE: ${{ needs.build.outputs.deployed_phone }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record status
        run: |
          mkdir -p docs
          cat > docs/GITHUB_PAGES_STATUS.md <<EOF
          # GitHub Pages 部署狀態

          官網與 Studio 建置：${BUILD_STATUS}

          GitHub Pages 發布：${DEPLOY_STATUS}

          本次部署電話：${DEPLOYED_PHONE:-未取得}

          Workflow Run ID：${WORKFLOW_RUN_ID}

          官網：https://te87037.github.io/mattress-factory-demo/

          後台：https://te87037.github.io/mattress-factory-demo/studio/
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GITHUB_PAGES_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record GitHub Pages status [skip ci]"
          git pull --rebase origin main
          git push
